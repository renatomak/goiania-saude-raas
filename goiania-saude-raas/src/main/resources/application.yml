spring:
  application:
    name: goiania-saude-raas
  datasource:
    url: ${DB_URL:jdbc:postgresql://10.52.31.100:5432/goiania_saude}
    username: ${DB_USERNAME:sictec_sms}
    password: ${DB_PASSWORD:sictec_sms}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:30000}
  jpa:
    hibernate:
      ddl-auto: none # ou 'validate' se quiser apenas validar a existência das tabelas
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: goiania_saude

server:
  port: ${PORT:8081}
  servlet:
    context-path: /api

logging:
  level:
    br.gov.goiania.saude.raas: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: WARN
