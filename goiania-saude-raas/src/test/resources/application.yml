spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/raas_test
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
# Ajuste os valores de url, username e password conforme seu ambiente de testes
# Certifique-se de que o banco de dados de teste está disponível durante a execução dos testes

